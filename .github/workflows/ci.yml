name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: nix flake check
        run: nix flake check --print-build-logs --impure
        env:
          NIXPKGS_ALLOW_UNFREE: "1"

      - name: nix build .#senpi
        run: nix build .#senpi --print-build-logs

      - name: Verify binary
        run: |
          set -euo pipefail
          test -x ./result/bin/senpi
          test -L ./result/bin/pi
          expected="$(jq -r '.version' hashes.json)"
          actual="$(./result/bin/senpi --version 2>&1)"
          if [ "$actual" != "$expected" ]; then
            echo "Version mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          fi
          ./result/bin/senpi --help 2>&1 | grep -qi 'senpi'

      - name: nix build .#omo-native
        run: nix build .#omo-native --print-build-logs --impure --out-link result-omo
        env:
          NIXPKGS_ALLOW_UNFREE: "1"

      - name: Verify OmO Native
        run: |
          set -euo pipefail
          pkg=./result-omo/lib/node_modules/omo-ai
          test -x ./result-omo/bin/omo
          test -f "$pkg/bin/omo.js"
          test -f "$pkg/plugin/extensions/omo.js"
          test -f "$pkg/plugin/runtime/lsp-daemon/dist/cli.js"
          test -d "$pkg/plugin/skills/ast-grep"

          expected="$(jq -r '.version' omo-hashes.json)"
          actual="$(./result-omo/bin/omo --version 2>&1)"
          case "$actual" in
            *"omo $expected"*) ;;
            *) echo "Version mismatch: expected omo $expected, got '$actual'" >&2; exit 1 ;;
          esac
          jq -e --arg v "$(jq -r '.version' hashes.json)" '.dependencies["@code-yeongyu/senpi"] == $v' "$pkg/package.json" > /dev/null
          ./result-omo/bin/omo --help > /dev/null
          ./result-omo/bin/comment-checker --help > /dev/null
          ./result-omo/bin/omo update --print | grep -q 'managed by Nix'

          agent_dir="$(mktemp -d)"
          trap 'rm -rf "$agent_dir"' EXIT
          PATH="$(realpath ./result-omo)/bin:$PATH" OMO_CODING_AGENT_DIR="$agent_dir" ./result-omo/bin/omo doctor > "$agent_dir/doctor.log" 2>&1
          grep -q "PASS senpi version $(jq -r '.version' hashes.json)" "$agent_dir/doctor.log"
          if grep -q '^FAIL ' "$agent_dir/doctor.log"; then
            cat "$agent_dir/doctor.log" >&2
            exit 1
          fi

      - name: Verify compatibility plugin output
        run: |
          set -euo pipefail
          nix build .#omo-senpi --impure --out-link result-omo-plugin
          test -f ./result-omo-plugin/lib/omo-senpi/extensions/omo.js
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
