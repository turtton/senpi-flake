name: Auto Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: Check for updates
        id: check
        run: |
          set -euo pipefail
          ./update.sh
          if git diff --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r '.version' hashes.json)
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build after update
        if: steps.check.outputs.updated == 'true'
        run: |
          set -euo pipefail
          nix flake check
          nix build .#senpi
          test -x ./result/bin/senpi
          test -L ./result/bin/pi
          expected="${{ steps.check.outputs.version }}"
          actual="$(./result/bin/senpi --version 2>&1)"
          if [ "$actual" != "$expected" ]; then
            echo "Version mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          fi
          ./result/bin/senpi --help 2>&1 | grep -qi 'senpi'

      - name: Create Pull Request
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@c66b8cb0050a39d19695bb3389f91c393c60f7f7 # v7
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update senpi to ${{ steps.check.outputs.version }}"
          title: "chore: update senpi to ${{ steps.check.outputs.version }}"
          body: |
            Automated update of senpi to version `${{ steps.check.outputs.version }}`.

            - **Version**: ${{ steps.check.outputs.version }}
            - **Source**: [@code-yeongyu/senpi on npm](https://www.npmjs.com/package/@code-yeongyu/senpi/v/${{ steps.check.outputs.version }})

            Built successfully; CI (`.github/workflows/ci.yml`) verifies the binary on pull_request.
          branch: auto-update
          delete-branch: true
