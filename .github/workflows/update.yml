name: Auto Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      pr_number: ${{ steps.cpr.outputs.pull-request-number }}
      version: ${{ steps.check.outputs.version }}
      omo_version: ${{ steps.check.outputs.omo_version }}
      omo_rev: ${{ steps.check.outputs.omo_rev }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      # senpi and omo-senpi are updated in lockstep: omo pins senpi peer
      # versions exactly, so shipping one without the other is what silently
      # disables the task/team components.
      - name: Check for updates
        id: check
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail
          ./update.sh
          ./update-omo.sh
          if git diff --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r '.version' hashes.json)
            OMO_VERSION=$(jq -r '.version' omo-hashes.json)
            OMO_REV=$(jq -r '.rev' omo-hashes.json)
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "omo_version=$OMO_VERSION" >> "$GITHUB_OUTPUT"
            echo "omo_rev=$OMO_REV" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build after update
        if: steps.check.outputs.updated == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail
          nix flake check --impure
          nix build .#senpi
          test -x ./result/bin/senpi
          test -L ./result/bin/pi
          expected="${{ steps.check.outputs.version }}"
          actual="$(./result/bin/senpi --version 2>&1)"
          if [ "$actual" != "$expected" ]; then
            echo "Version mismatch: expected '$expected', got '$actual'"
            exit 1
          fi
          ./result/bin/senpi --help 2>&1 | grep -qi 'senpi'

          nix build .#omo-senpi --impure --out-link result-omo
          test -f ./result-omo/lib/omo-senpi/extensions/omo.js
          test -f ./result-omo/lib/omo-senpi/runtime/lsp-daemon/dist/cli.js
          test -d ./result-omo/lib/omo-senpi/skills/ast-grep

      - name: Create Pull Request
        id: cpr
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@c66b8cb0050a39d19695bb3389f91c393c60f7f7 # v7
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update senpi to ${{ steps.check.outputs.version }} and omo-senpi to ${{ steps.check.outputs.omo_version }}"
          title: "chore: update senpi to ${{ steps.check.outputs.version }} and omo-senpi to ${{ steps.check.outputs.omo_version }}"
          body: |
            Automated lockstep update of senpi and omo-senpi.

            - **senpi**: ${{ steps.check.outputs.version }} — [npm](https://www.npmjs.com/package/@code-yeongyu/senpi/v/${{ steps.check.outputs.version }})
            - **omo-senpi**: ${{ steps.check.outputs.omo_version }} — [`${{ steps.check.outputs.omo_rev }}`](https://github.com/code-yeongyu/oh-my-openagent/commit/${{ steps.check.outputs.omo_rev }})

            Built successfully; CI (`.github/workflows/ci.yml`) verifies both on pull_request.
          branch: auto-update
          delete-branch: true

  # bunDepsHash differs per platform (bun install produces platform-specific
  # node_modules).  The ubuntu job above discovers the x86_64-linux hash; this
  # macOS job discovers the aarch64-darwin hash and pushes it to the same PR.
  discover-macos-hash:
    needs: update
    if: needs.update.outputs.updated == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          ref: auto-update
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      - name: Discover aarch64-darwin bunDepsHash
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail
          if nix build .#omo-senpi --impure --no-link 2>/dev/null; then
            echo "omo-senpi already builds on macOS — hash up to date"
            exit 0
          fi

          echo "omo-senpi hash mismatch on macOS — discovering correct hash..."
          log=$(mktemp)
          nix build .#omo-senpi --impure --no-link 2> "$log" || true
          new_hash=$(
            grep -E '^\s*got:\s+sha256-' "$log" \
              | head -n1 \
              | sed -E 's/.*got:\s+(sha256-[A-Za-z0-9+/=]+).*/\1/'
          )
          if [ -z "$new_hash" ]; then
            echo "Failed to discover aarch64-darwin bunDepsHash" >&2
            tail -n 30 "$log" >&2
            exit 1
          fi
          echo "Discovered aarch64-darwin bunDepsHash: $new_hash"

          jq --arg v "$new_hash" '.bunDepsHash["aarch64-darwin"] = $v' omo-hashes.json > omo-hashes.json.tmp
          mv omo-hashes.json.tmp omo-hashes.json

          git config user.name "turtton[bot]"
          git config user.email "turtton[bot]@users.noreply.github.com"
          git add omo-hashes.json
          git commit -m "fix: update aarch64-darwin bunDepsHash for omo-senpi ${{ needs.update.outputs.omo_version }}"
          git push
