name: Auto Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      pr_number: ${{ steps.cpr.outputs.pull-request-number }}
      version: ${{ steps.check.outputs.version }}
      omo_version: ${{ steps.check.outputs.omo_version }}
      cc_version: ${{ steps.check.outputs.cc_version }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

      # omo-ai pins its senpi engine exactly; resolve that version first.
      - name: Check for updates
        id: check
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail
          ./update-omo.sh
          ./update.sh "$(jq -r '.senpiVersion' omo-hashes.json)"
          if git diff --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "updated=true"
              echo "version=$(jq -r '.version' hashes.json)"
              echo "omo_version=$(jq -r '.version' omo-hashes.json)"
              echo "cc_version=$(jq -r '.commentChecker.version' omo-hashes.json)"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build after update
        if: steps.check.outputs.updated == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail
          nix flake check --impure
          nix build .#senpi --out-link result-senpi
          test -x ./result-senpi/bin/senpi
          test -L ./result-senpi/bin/pi
          test "$(./result-senpi/bin/senpi --version 2>&1)" = "${{ steps.check.outputs.version }}"
          ./result-senpi/bin/senpi --help 2>&1 | grep -qi senpi

          nix build .#omo-native --impure --out-link result-omo
          test -x ./result-omo/bin/omo
          test -x ./result-omo/bin/comment-checker
          pkg=./result-omo/lib/node_modules/omo-ai
          test -f "$pkg/plugin/extensions/omo.js"
          test -f "$pkg/plugin/runtime/lsp-daemon/dist/cli.js"
          jq -e --arg v "${{ steps.check.outputs.version }}" \
            '.dependencies["@code-yeongyu/senpi"] == $v' "$pkg/package.json" > /dev/null
          ./result-omo/bin/omo --version 2>&1 | grep -F "omo ${{ steps.check.outputs.omo_version }}"
          ./result-omo/bin/omo --help > /dev/null
          ./result-omo/bin/comment-checker --help > /dev/null

      - name: Create Pull Request
        id: cpr
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@c66b8cb0050a39d19695bb3389f91c393c60f7f7 # v7
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update OmO Native to ${{ steps.check.outputs.omo_version }} and senpi to ${{ steps.check.outputs.version }}"
          title: "chore: update OmO Native to ${{ steps.check.outputs.omo_version }} and senpi to ${{ steps.check.outputs.version }}"
          body: |
            Automated update to the published OmO Native package and its exact-pinned senpi engine.

            - **OmO Native**: ${{ steps.check.outputs.omo_version }} — [npm](https://www.npmjs.com/package/omo-ai/v/${{ steps.check.outputs.omo_version }})
            - **senpi**: ${{ steps.check.outputs.version }} — [npm](https://www.npmjs.com/package/@code-yeongyu/senpi/v/${{ steps.check.outputs.version }})
            - **comment-checker**: ${{ steps.check.outputs.cc_version }} — [release](https://github.com/code-yeongyu/go-claude-code-comment-checker/releases/tag/v${{ steps.check.outputs.cc_version }})

            Built successfully; CI verifies both on pull_request.
          branch: auto-update
          delete-branch: true
